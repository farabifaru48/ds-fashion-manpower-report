<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Manpower Report</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1d21;--mut:#6b7280;--bd:#d9dde3;--ac:#0f766e;--acx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f5f7;--card:#fff;--tx:#1a1d21;--mut:#6b7280;--bd:#d9dde3;--ac:#0f766e;--acx:#fff}
:root[data-theme="dark"]{--bg:#14171a;--card:#1f2327;--tx:#eceff2;--mut:#9aa3ad;--bd:#343a40;--ac:#2dd4bf;--acx:#06201d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1f2327;--tx:#eceff2;--mut:#9aa3ad;--bd:#343a40;--ac:#2dd4bf;--acx:#06201d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .2s,color .2s}
main{max-width:720px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
h1{font-size:18px;margin:0}
h2{font-size:14px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 28px;gap:6px;margin-bottom:6px;align-items:center}
.row.o{grid-template-columns:1.5fr 1fr 1fr 28px}
.row.h{font-size:12px;color:var(--mut);font-weight:600}
input{width:100%;min-width:0;padding:9px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
input.n{text-align:center}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.theme-btn{padding:6px 12px;font-size:13px;border-radius:20px}
.x{padding:4px 0;color:var(--mut);border:0;background:none}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar button{flex:1 1 140px}
.sc{overflow-x:auto}
#report{background:#fff;color:#111;padding:16px;width:420px;margin:0 auto;font-family:Arial,Helvetica,sans-serif}
#report h3{margin:0;text-align:center;font-size:17px}
#report .s{text-align:center;font-size:12px;color:#444;margin:2px 0 10px}
#report table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:13px}
#report th,#report td{border:1px solid #333;padding:4px 6px;text-align:center}
#report th{background:#e8eef0}
#report td:first-child,#report th:first-child{text-align:left}
#report tr.t td{font-weight:700;background:#f3f3f3}
#report .sum{display:flex;gap:6px}
#report .sum div{flex:1;border:2px solid #0f766e;border-radius:6px;text-align:center;padding:6px;font-size:12px}
#report .sum b{display:block;font-size:20px}
#report .sum .g{background:#0f766e;color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#modal.on{display:flex}
#modal .b{background:var(--card);border-radius:12px;padding:12px;max-width:520px;width:100%;max-height:100%;overflow:auto}
#modal img{width:100%;border-radius:6px}
#modal a{display:block;text-align:center;text-decoration:none;margin-top:8px}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
</head>
<body>
<main>
<header>
  <h1>📋 Daily Manpower Report</h1>
  <button id="theme-btn" class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme"></button>
</header>

<div class="card">
  <h2>Date</h2>
  <input type="date" id="date">
</div>

<div class="card">
  <h2>Line wise</h2>
  <div id="lines"></div>
  <button onclick="addRow('l')">+ Line add</button>
</div>

<div class="card">
  <h2>Others</h2>
  <div id="others"></div>
  <button onclick="addRow('o')">+ Row add</button>
  <p style="font-size:12px;color:var(--mut);margin:8px 0 0">Extra-r moto jog korte hole 12+12 likhte paro, auto jog hobe.</p>
</div>

<div class="bar" style="margin-bottom:12px">
  <button class="p" onclick="act('share')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.23 8.23 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.2-.32a8.19 8.19 0 0 1-1.26-4.37c0-4.54 3.7-8.25 8.25-8.25m-2.52 3.97c-.17 0-.44.06-.67.31-.23.25-.86.84-.86 2.05 0 1.21.88 2.37 1 2.53.13.16 1.74 2.65 4.2 3.71 2.04.89 2.46.71 2.91.67.46-.04 1.47-.6 1.68-1.19.21-.59.21-1.09.14-1.19-.06-.11-.23-.17-.48-.3-.25-.12-1.49-.73-1.72-.82-.23-.08-.39-.13-.56.12-.17.25-.64.83-.78 1-.14.16-.29.18-.53.06-.25-.12-1.05-.38-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.24-.01-.38.11-.5.11-.11.25-.29.38-.44.12-.15.16-.25.24-.42.08-.16.04-.31-.02-.43-.06-.13-.56-1.35-.77-1.85-.2-.5-.4-.43-.55-.44-.15 0-.32 0-.34.08z"/></svg>
    WhatsApp / Share
  </button>
  <button onclick="act('dl')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    PNG Download
  </button>
  <button onclick="if(confirm('সব ডাটা মুছে রিসেট করবেন? (Reset)')){reset()}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
    Reset
  </button>
</div>

<h2>Preview</h2>
<div class="card sc"><div id="report"></div></div>
</main>

<div id="modal"><div class="b">
  <p style="margin:0 0 8px;font-size:13px">Chobi-te chepe dhore rakhle Save / Share option ashbe. Ba niche button use koro.</p>
  <img id="pimg" alt="report">
  <a id="dla" download="manpower.png"><button class="p" style="width:100%">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    PNG Save
  </button></a>
  <a id="wa" target="_blank" rel="noopener"><button style="width:100%">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.23 8.23 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.2-.32a8.19 8.19 0 0 1-1.26-4.37c0-4.54 3.7-8.25 8.25-8.25m-2.52 3.97c-.17 0-.44.06-.67.31-.23.25-.86.84-.86 2.05 0 1.21.88 2.37 1 2.53.13.16 1.74 2.65 4.2 3.71 2.04.89 2.46.71 2.91.67.46-.04 1.47-.6 1.68-1.19.21-.59.21-1.09.14-1.19-.06-.11-.23-.17-.48-.3-.25-.12-1.49-.73-1.72-.82-.23-.08-.39-.13-.56.12-.17.25-.64.83-.78 1-.14.16-.29.18-.53.06-.25-.12-1.05-.38-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.24-.01-.38.11-.5.11-.11.25-.29.38-.44.12-.15.16-.25.24-.42.08-.16.04-.31-.02-.43-.06-.13-.56-1.35-.77-1.85-.2-.5-.4-.43-.55-.44-.15 0-.32 0-.34.08z"/></svg>
    WhatsApp khulo
  </button></a>
  <button style="width:100%;margin-top:8px" onclick="$('modal').classList.remove('on')">Bondho</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const K='dsf_manpower_v1';
const TK='dsf_theme_mode';

/* Theme System */
function getActiveTheme(){
 return document.documentElement.getAttribute('data-theme')||
  (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
}
function updateThemeUI(t){
 const btn=$('theme-btn');
 if(!btn)return;
 if(t==='dark'){
  btn.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg> Light`;
 } else {
  btn.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg> Dark`;
 }
}
function applyTheme(t){
 document.documentElement.setAttribute('data-theme',t);
 try{localStorage.setItem(TK,t)}catch(e){}
 updateThemeUI(t);
}
function toggleTheme(){
 const cur=getActiveTheme();
 applyTheme(cur==='dark'?'light':'dark');
}

/* Initial Theme Load */
const savedTheme=localStorage.getItem(TK);
if(savedTheme){
 applyTheme(savedTheme);
} else {
 updateThemeUI(getActiveTheme());
}

/* Aj-er date */
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function msg(){return "Dear sir\nToday's Manpower Present Status."}

const dflt=()=>({date:today(),
 l:['01','02','03','04','05','06','07+08'].map(n=>({n,a:'',b:'',c:''})),
 o:[['Size set'],['Alter'],['Piping'],['AESN'],['Heat seal'],['Extra']].map(x=>({n:x[0],op:'',hp:''}))});

let S;
try{S=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
if(!S||!S.l||!S.o)S=dflt();

/* Purono data-te op/hp ba n undefined thakle thik kora */
S.l = (S.l||[]).map(r=>({n:r?.n||'', a:r?.a||'', b:r?.b||'', c:r?.c||''}));
S.o = (S.o||[]).map(r=>(typeof r==='string'?{n:r,op:'',hp:''}:{n:r?.n||'', op:r?.op||'', hp:r?.hp||''}));

S.date=today();
let opened=today();

const num=s=>String(s||'').split('+').reduce((a,x)=>a+(parseFloat(x)||0),0);
const pad=n=>n?String(n).padStart(2,'0'):'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}

function form(){
 $('lines').innerHTML='<div class="row h"><span>Line</span><span>R/M</span><span>OP/HP</span><span>HP</span><span></span></div>'+
 S.l.map((r,i)=>`<div class="row"><input data-k="l" data-i="${i}" data-f="n" value="${esc(r.n)}">`+
 ['a','b','c'].map(f=>`<input class="n" inputmode="text" data-k="l" data-i="${i}" data-f="${f}" value="${esc(r[f])}">`).join('')+
 `<button class="x" onclick="del('l',${i})">✕</button></div>`).join('');
 $('others').innerHTML='<div class="row o h"><span>Section</span><span>OP</span><span>HP</span><span></span></div>'+
 S.o.map((r,i)=>`<div class="row o"><input data-k="o" data-i="${i}" data-f="n" value="${esc(r.n)}">`+
 ['op','hp'].map(f=>`<input class="n" inputmode="text" data-k="o" data-i="${i}" data-f="${f}" value="${esc(r[f])}">`).join('')+
 `<button class="x" onclick="del('o',${i})">✕</button></div>`).join('');
}
function addRow(k){S[k].push(k=='l'?{n:'',a:'',b:'',c:''}:{n:'',op:'',hp:''});form();draw()}
function del(k,i){S[k].splice(i,1);form();draw()}

/* Reset: shob number faka korbe kintu nam gulo thakbe */
function reset(){
 S={date:today(),
  l:S.l.map(r=>({n:r.n||'',a:'',b:'',c:''})),
  o:S.o.map(r=>({n:r.n||'',op:'',hp:''}))};
 opened=today();
 $('date').value=S.date;form();draw();
}

function calc(){
 let a=0,b=0,c=0;S.l.forEach(r=>{a+=num(r.a);b+=num(r.b);c+=num(r.c)});
 let oo=0,oh=0;S.o.forEach(r=>{oo+=num(r.op);oh+=num(r.hp)});
 const OP=a+b+oo,HP=c+oh;return{a,b,c,OP,HP,T:OP+HP,lt:a+b+c}}
function fd(d){const p=(d||'').split('-');return p.length==3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:''}

function draw(){
 const t=calc();
 const lr=S.l.map(r=>{const s=num(r.a)+num(r.b)+num(r.c);return `<tr><td>${esc(r.n)}</td><td>${pad(num(r.a))}</td><td>${pad(num(r.b))}</td><td>${pad(num(r.c))}</td><td><b>${s?s:''}</b></td></tr>`}).join('');
 const or=S.o.map(r=>`<tr><td>${esc(r.n)}</td><td>${r.op?pad(num(r.op)):''}</td><td>${r.hp?pad(num(r.hp)):''}</td></tr>`).join('');
 $('report').innerHTML=`<h3>Today Manpower Present Status</h3><div class="s">DS Fashion Ltd &nbsp;|&nbsp; Date: ${fd(S.date)}</div>
 <table><tr><th>Line</th><th>R/M</th><th>OP/HP</th><th>HP</th><th>Total</th></tr>${lr}
 <tr class="t"><td>Total</td><td>${t.a}</td><td>${t.b}</td><td>${t.c}</td><td>${t.lt}</td></tr></table>
 <table><tr><th>Others</th><th>OP</th><th>HP</th></tr>${or}</table>
 <div class="sum"><div>OP<b>${t.OP}</b></div><div>HP<b>${t.HP}</b></div><div class="g">Grand Total<b>${t.T}</b></div></div>`;
 save();
}

document.addEventListener('input',e=>{
 const d=e.target.dataset;
 if(e.target.id=='date'){S.date=e.target.value;draw();return}
 if(d&&d.k){S[d.k][d.i][d.f]=e.target.value;draw()}
});

document.addEventListener('visibilitychange',()=>{
 if(!document.hidden&&today()!==opened){opened=today();S.date=today();$('date').value=S.date;draw()}
});

/* PNG toiri */
function cv(){
 const t=calc(),W=420,RH=24;
 const tb=[
  {h:['Line','R/M','OP/HP','HP','Total'],f:[.28,.18,.18,.18,.18],
   r:S.l.map(r=>{const s=num(r.a)+num(r.b)+num(r.c);return[r.n||'',pad(num(r.a)),pad(num(r.b)),pad(num(r.c)),s||'']}),
   t:['Total',t.a,t.b,t.c,t.lt]},
  {h:['Others','OP','HP'],f:[.5,.25,.25],
   r:S.o.map(r=>[r.n||'',r.op?pad(num(r.op)):'',r.hp?pad(num(r.hp)):'']),t:null}
 ];
 const H=62+tb.reduce((a,x)=>a+(x.r.length+1+(x.t?1:0))*RH+12,0)+72;
 const c=document.createElement('canvas');c.width=W*2;c.height=H*2;
 const g=c.getContext('2d');g.scale(2,2);
 g.fillStyle='#fff';g.fillRect(0,0,W,H);g.textBaseline='middle';g.textAlign='center';
 g.fillStyle='#111';g.font='bold 17px Arial';g.fillText('Today Manpower Present Status',W/2,28);
 g.fillStyle='#444';g.font='12px Arial';g.fillText('DS Fashion Ltd  |  Date: '+fd(S.date),W/2,48);
 let y=62;
 tb.forEach(T=>{
  const w=W-32,rows=[T.h,...T.r];if(T.t)rows.push(T.t);
  rows.forEach((row,ri)=>{
   let x=16;const bold=ri==0||(T.t&&ri==rows.length-1);
   row.forEach((cell,ci)=>{
    const cw=w*T.f[ci];
    g.fillStyle=ri==0?'#e8eef0':(T.t&&ri==rows.length-1)?'#f3f3f3':'#fff';g.fillRect(x,y,cw,RH);
    g.strokeStyle='#333';g.lineWidth=1;g.strokeRect(x,y,cw,RH);
    g.fillStyle='#111';g.font=(bold?'bold ':'')+'13px Arial';
    g.textAlign=ci?'center':'left';g.fillText(String(cell!=null?cell:''),ci?x+cw/2:x+6,y+RH/2);
    x+=cw});
   y+=RH});
  y+=12});
 const bw=(W-32-12)/3;
 [['OP',t.OP],['HP',t.HP],['Grand Total',t.T]].forEach((b,i)=>{
  const x=16+i*(bw+6),l=i==2;
  g.fillStyle=l?'#0f766e':'#fff';g.fillRect(x,y,bw,56);
  g.strokeStyle='#0f766e';g.lineWidth=2;g.strokeRect(x,y,bw,56);
  g.fillStyle=l?'#fff':'#111';g.textAlign='center';g.font='12px Arial';g.fillText(b[0],x+bw/2,y+16);
  g.font='bold 20px Arial';g.fillText(String(b[1]),x+bw/2,y+38)});
 return c}

async function act(mode){
 let canvas;
 try{canvas=cv()}catch(e){alert('Image toiri hoyni, abar chesta koro.');return}
 const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
 const name='manpower-'+S.date+'.png';
 const url=URL.createObjectURL(blob);
 if(mode=='share'){
  try{const f=new File([blob],name,{type:'image/png'});
   if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:msg()});return}}
  catch(e){if(e&&e.name=='AbortError')return}
 }
 $('pimg').src=url;$('dla').href=url;$('dla').download=name;
 $('wa').href='https://wa.me/?text='+encodeURIComponent(msg());
 $('modal').classList.add('on');
 if(mode=='dl'){try{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
}

$('date').value=S.date;form();draw();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
